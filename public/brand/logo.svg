<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9EE"/>
      <stop offset="35%" stop-color="#F2E4AD"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(10, 12)">
    <polygon points="28,5 48,45 8,45" fill="none" stroke="url(#logoGold)" stroke-width="2.5"/>
    <polygon points="28,45 40,20 16,20" fill="none" stroke="url(#logoGold)" stroke-width="1.8"/>
    <circle cx="28" cy="28" r="3" fill="url(#logoGold)" filter="url(#logoGlow)"/>
  </g>

  <!-- Brand Typography -->
  <text x="75" y="42" font-family="'Fraunces', serif" font-weight="800" font-size="28" fill="url(#logoGold)" letter-spacing="6">VEYLORA</text>
  <text x="77" y="58" font-family="'Geist Sans', sans-serif" font-weight="500" font-size="8" fill="#D4AF37" letter-spacing="4">AUTOMOTIVE SANCTUARY</text>
</svg>
